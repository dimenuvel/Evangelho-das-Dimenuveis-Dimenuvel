name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Java 17 Compatibility
        run: |
          chmod +x android/gradlew

          GRADLE_FILE="android/app/build.gradle"

          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' "$GRADLE_FILE"
            sed -i 's/sourceCompatibility JavaVersion.VERSION_1_8/sourceCompatibility JavaVersion.VERSION_17/g' "$GRADLE_FILE"
            sed -i 's/targetCompatibility JavaVersion.VERSION_1_8/targetCompatibility JavaVersion.VERSION_17/g' "$GRADLE_FILE"
          fi

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        run: |
          mkdir -p output-apk
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          cp "$APK" output-apk/DIMENUVEL-TheLastAbiders-release.apk
          ls -lh output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIMENUVEL-TheLastAbiders-APK
          path: output-apk/DIMENUVEL-TheLastAbiders-release.apk
          retention-days: 30
          if-no-files-found: error
