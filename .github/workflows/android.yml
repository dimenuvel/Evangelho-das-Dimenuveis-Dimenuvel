
name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APKs (Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Android APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Locate and Package APKs
        run: |
          mkdir -p output-apk

          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -print -quit)

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated!"
            exit 1
          fi

          cp "$RELEASE_APK" output-apk/Evangelho-das-Dimenuveis-v1.0-release.apk
          cp "$DEBUG_APK" output-apk/Evangelho-das-Dimenuveis-v1.0-debug.apk

          echo "Generated APK files:"
          ls -lh output-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Evangelho-das-Dimenuveis-v1.0-APKs
          path: output-apk/*.apk
          retention-days: 30
          if-no-files-found: error
